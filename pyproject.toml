[project]
name = "jev-tutorial"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.7.21",
    "httpx>=0.28.1",
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
    "langchain>=1.4.3",
    "langchain-openai>=1.6.7",
    "langgraph>=1.2.12",
    "langgraph-cli[inmem]>=0.4.32",
    "matplotlib>=3.11.2",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pandas>=3.0.6",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-timeout>=2.4.0",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 99

[tool.pytest.ini_options]
pythonpath = ["."]
